# Сборка llama.cpp, совместимая с Windows 7 SP1, для канала «Win7-compat» в разделе «Движок».
# Отличия от официальных сборок:
#   * _WIN32_WINNT=0x0601 — без API новее Win7 (на этапе компиляции);
#   * статический CRT (/MT) — не нужен VC++ redist, которого часто нет на Win7;
#   * все варианты CPU (GGML_CPU_ALL_VARIANTS) + отдельная сборка Vulkan.
# Публикуется релизом с тегом llama-<tag>-win7 в ЭТОМ репозитории; имена архивов совпадают с форматом,
# который понимает AssetMatcher: llama-<tag>-bin-win7-<backend>-x64.zip.
# ВНИМАНИЕ: работоспособность на реальной Win7 нужно проверять вручную (см. TODO.md, «Риски»).
name: llama-win7

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег llama.cpp (например, b12176)'
        required: true
        default: 'b12176'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        backend: [ cpu, vulkan ]
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ github.event.inputs.tag }}

      - name: Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.290.0
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          $common = @(
            '-B', 'build', '-A', 'x64',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded',
            '-DCMAKE_C_FLAGS=/D_WIN32_WINNT=0x0601 /DWINVER=0x0601',
            '-DCMAKE_CXX_FLAGS=/D_WIN32_WINNT=0x0601 /DWINVER=0x0601',
            '-DBUILD_SHARED_LIBS=ON',
            '-DLLAMA_CURL=OFF',
            '-DLLAMA_BUILD_TESTS=OFF',
            '-DGGML_NATIVE=OFF',
            '-DGGML_BACKEND_DL=ON',
            '-DGGML_CPU_ALL_VARIANTS=ON',
            '-DGGML_OPENMP=OFF'
          )
          if ('${{ matrix.backend }}' -eq 'vulkan') { $common += '-DGGML_VULKAN=ON' }
          cmake @common

      - name: Build
        run: cmake --build build --config Release -j 4 --target llama-server llama-bench llama-cli

      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          $out = "llama-$tag-bin-win7-${{ matrix.backend }}-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/bin/Release/*.exe, build/bin/Release/*.dll $out -ErrorAction SilentlyContinue
          Copy-Item LICENSE $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
          Get-Item "$out.zip" | Format-Table Name, Length

      - name: Smoke test (--version)
        shell: pwsh
        run: |
          $dir = "llama-${{ github.event.inputs.tag }}-bin-win7-${{ matrix.backend }}-x64"
          & "$dir/llama-server.exe" --version
          if ($LASTEXITCODE -ne 0 -and '${{ matrix.backend }}' -eq 'cpu') { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: llama-win7-${{ matrix.backend }}
          path: llama-*-bin-win7-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-${{ github.event.inputs.tag }}-win7
          name: llama.cpp ${{ github.event.inputs.tag }} (Win7-compat)
          prerelease: true
          files: dist/*.zip
